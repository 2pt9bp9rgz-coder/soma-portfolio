<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>お問い合わせ | Soma Nisihara</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/contact-form.css?v=2" />
<link rel="stylesheet" href="css/page-transition.css?v=2" />
</head>
<body>
<div class="page-transition" id="page-transition" aria-hidden="true">
  <span class="page-transition-strip"></span>
  <span class="page-transition-strip"></span>
  <span class="page-transition-strip"></span>
  <span class="page-transition-strip"></span>
  <span class="page-transition-strip"></span>
  <span class="page-transition-strip"></span>
  <span class="page-transition-strip"></span>
</div>
<script src="js/page-transition.js?v=4"></script>

<div class="form-page">
  <a class="form-back" href="index.html">← 戻る</a>

  <div class="form-heading-wrap">
    <span class="form-heading">CONTACT</span>
    <span class="form-heading-dash"></span>
  </div>

  <form class="contact-form" id="contact-form">
    <label class="form-field">
      <span class="form-field-en">Name</span>
      <span class="form-field-ja">お名前</span>
      <input type="text" name="name" required />
    </label>

    <label class="form-field">
      <span class="form-field-en">Email</span>
      <span class="form-field-ja">メールアドレス</span>
      <input type="email" name="email" required />
    </label>

    <div class="form-field">
      <span class="form-field-en">Inquiry Type</span>
      <span class="form-field-ja">お問い合わせ種別</span>
      <div class="form-checkboxes">
        <label class="form-checkbox">
          <input type="checkbox" name="type" value="お仕事に関するご相談" />
          <span>
            <span class="form-field-en">Business-related consultations</span>
            <span class="form-field-ja">お仕事に関するご相談</span>
          </span>
        </label>
        <label class="form-checkbox">
          <input type="checkbox" name="type" value="その他" />
          <span>
            <span class="form-field-en">Others</span>
            <span class="form-field-ja">その他</span>
          </span>
        </label>
      </div>
    </div>

    <label class="form-field">
      <span class="form-field-en">Description</span>
      <span class="form-field-ja">お問い合わせ内容</span>
      <textarea name="description" rows="6" required></textarea>
    </label>

    <button type="submit" class="form-submit">送信する →</button>

    <p class="form-status" id="form-status"></p>
  </form>
</div>

<script src="js/contact-form.js?v=2"></script>
</body>
</html>
